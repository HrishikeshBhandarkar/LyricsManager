<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lyrics Viewer - Dynamic ELRC & LRC Visualizer</title>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: "MySanFrancisco";
            src: url("https://raw.githubusercontent.com/sahibjotsaggu/San-Francisco-Pro-Fonts/refs/heads/master/SF-Pro-Display-Bold.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg: #050505; 
            --surface: #121214; 
            --surface-glass: rgba(20, 20, 25, 0.7);
            --border: #26262a;
            --accent: #ffffff; 
            --accent-glow: rgba(255, 255, 255, 0.3);
            --text: #f0f0f5; 
            --muted: #71717a;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            --font-am: 'Outfit', 'Noto Sans Devanagari', "MySanFrancisco", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background: #000000;
            color: var(--text); font-family: var(--font); margin: 0; 
            height: 100dvh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; 
        }
        
        /* BG gradient animation removed per user request */
        
        .app { display: flex; height: 100%; width: 100%; position: relative; z-index: 10; overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        /* --- SIDEBAR PANEL --- */
        .sidebar {
            width: 360px; background: rgba(10, 10, 12, 0.95); backdrop-filter: blur(20px); border-right: 1px solid var(--border);
            padding: 24px; display: flex; flex-direction: column; gap: 18px; 
            z-index: 300; position: absolute; height: 100%; left: 0; top: 0;
            transform: translateX(-100%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto; padding-bottom: calc(24px + env(safe-area-inset-bottom));
        }
        .sidebar.open { transform: translateX(0); }
        @media(min-width: 900px) { 
            .sidebar { position: relative; transform: none; box-shadow: none; width: 350px; } 
            .sidebar.closed { margin-left: -350px; } 
        }

        .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        .logo { font-weight: 900; font-size: 1.3rem; letter-spacing: -0.5px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .logo-badge { font-size: 0.65rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 99px; text-transform: uppercase; }
        
        .close-btn { 
            background: #222; border: 1px solid #333; color: white; 
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem; 
        }
        
        .group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; padding-left: 2px; }
        
        textarea, input[type="text"] { 
            width: 100%; background: var(--surface); border: 1px solid var(--border); 
            color: white; padding: 14px; border-radius: 14px; 
            font-family: inherit; font-size: 0.85rem; transition: border-color 0.2s;
        }
        textarea:focus, input[type="text"]:focus { border-color: rgba(255,255,255,0.5); }
        textarea { resize: none; font-family: var(--mono); height: 180px; line-height: 1.4; }

        .btn { 
            background: var(--surface); border: 1px solid var(--border); color: white; 
            padding: 12px 18px; border-radius: 99px; 
            cursor: pointer; font-weight: 600; font-size: 0.85rem; 
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1; 
        }
        .btn:hover { background: #1c1c20; border-color: #444; }
        .btn:active { transform: scale(0.98); }
        .btn.primary { background: var(--accent); color: black; border: none; font-weight: 700; }
        .btn.primary:hover { background: #e0e0e0; }
        .btn.sm { padding: 8px 16px; font-size: 0.75rem; width: auto; flex: initial; }
        
        .detected-badge {
            display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(255,255,255,0.04); 
            border: 1px solid var(--border); border-radius: 12px; font-size: 0.8rem; font-weight: 600;
        }
        .detected-indicator { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; }

        .yt-wrapper { margin-top: 6px; background: #000; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; height: 170px; position: relative; flex-shrink: 0; }
        #yt-player { width: 100%; height: 100%; }
        #yt-status {
            position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
            text-align: center; font-size: 0.72rem; color: var(--muted); padding: 12px; z-index: 5;
            line-height: 1.5;
        }
        #yt-status.show { display: flex; }
        #yt-status a { color: var(--accent); text-decoration: underline; }

        /* --- DISPLAY AREA --- */
        .editor { flex: 1; position: relative; display: flex; flex-direction: column; background: transparent; transition: margin-left 0.35s ease; height: 100%; }
        
        .top-bar { 
            height: 64px; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 24px; background: rgba(5,5,5,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); 
            z-index: 20; flex-shrink: 0; 
        }
        .time-disp { font-family: var(--mono); font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }

        /* --- am-lyrics web component (am-lyrics.js v1.5.4, verbatim from Research/am-lyrics.js) --- */
        am-lyrics {
            display: block;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
        }

        /* --- CONTROL DOCK --- */
        .dock {
            position: absolute; left: 50%; transform: translateX(-50%); width: 92%; max-width: 580px;
            background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 40px; padding: 18px 24px;
            display: flex; flex-direction: column; gap: 14px; z-index: 100;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            bottom: calc(24px + env(safe-area-inset-bottom)); 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sliders { display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 0.78rem; color: #a1a1aa; }
        input[type=range] { -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 5px; border-radius: 3px; flex: 1; padding: 0; border: none; cursor: pointer; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: white; border-radius: 50%; box-shadow: 0 0 12px rgba(255,255,255,0.6); }
        
        .controls { display: flex; align-items: center; justify-content: center; gap: 16px; }
        .c-btn { background: transparent; border: none; color: white; font-size: 1.1rem; cursor: pointer; opacity: 0.7; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .c-btn:hover { opacity: 1; background: rgba(255,255,255,0.08); }
        .speed-btn { font-size: 0.85rem; font-weight: 700; color: var(--accent); opacity: 0.8; font-family: var(--mono); }

        .play-btn { width: 56px; height: 56px; background: white; color: black; border-radius: 50%; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: transform 0.2s; border: none; }
        .play-btn:active { transform: scale(0.95); }

        .credits { text-align: center; color: #52525b; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; opacity: 0.6; }
        .sidebar .credits { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="app" id="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">✨ Lyrics Viewer <span class="logo-badge" id="mode-badge">Auto</span></div>
            <button class="close-btn" onclick="toggleSidebar(false)">×</button>
        </div>
        
        <div class="group">
            <label>YouTube Song Link</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="yt-url" placeholder="https://youtu.be/..." onchange="loadVideo()">
                <button class="btn primary sm" onclick="loadVideo()">Load</button>
            </div>
            <div class="yt-wrapper"><div id="yt-player"></div><div id="yt-status"></div></div>
        </div>

        <div class="group">
            <label>Paste Synced Lyrics (LRC or ELRC)</label>
            <textarea id="raw-input" placeholder="Paste your synced LRC or word-by-word ELRC lyrics here...&#10;&#10;e.g.&#10;[00:21.90][v1] <00:21.90>I'm <00:22.07>tired <00:22.21>of <00:22.40>being..."></textarea>
            <div style="display:flex; gap:8px;">
                <button class="btn primary" onclick="parseAndDisplayLyrics()">Display Lyrics</button>
                <button class="btn" id="btn-fetch" onclick="fetchLyrics()">⚡ Auto Fetch</button>
            </div>
        </div>

        <div class="detected-badge">
            <div class="detected-indicator" id="detected-ind"></div>
            <span id="detected-text">Paste lyrics to auto-detect format</span>
        </div>

        <div class="credits">Created by Noob.exe</div>
    </div>

    <div class="editor">
        <div class="top-bar">
            <button class="btn sm" onclick="toggleSidebar(true)">⚙ Settings & Input</button>
            <div class="time-disp" id="time-display">00:00.00</div>
            <div style="font-size:0.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px;" id="song-title-disp">Lyrics Display</div>
        </div>

        <am-lyrics id="lyrics-container" style="opacity:0"></am-lyrics>

        <div class="dock">
            <div class="sliders">
                <span id="curr-t">0:00</span>
                <input type="range" id="seek" value="0" step="0.1" oninput="userSeek()">
                <span id="dur-t">0:00</span>
            </div>
            
            <div class="controls">
                <button class="c-btn speed-btn" id="btn-speed" onclick="cycleSpeed()">1.0x</button>
                <button class="c-btn" onclick="seek(-5)">-5s</button>
                <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
                <button class="c-btn" onclick="seek(5)">+5s</button>
            </div>
        </div>
    </div>
</div>

<script src="am-lyrics.js"></script>
<script>
    let player, timer;
    let state = {
        lyrics: [], 
        mode: 'auto', // 'word' or 'line'
        videoTitle: "Song Lyrics"
    };
    let speeds = [0.5, 0.75, 1.0, 1.25, 1.5];
    let speedIdx = 2; 


    let ytApiReadyPromise = null;
    function ensureYTApi() {
        if (window.YT && YT.Player) return Promise.resolve();
        if (ytApiReadyPromise) return ytApiReadyPromise;
        ytApiReadyPromise = new Promise((resolve, reject) => {
            const timer = setTimeout(() => { ytApiReadyPromise = null; reject(new Error("Timed out loading YouTube API. Check your connection.")); }, 15000);
            window.onYouTubeIframeAPIReady = () => { clearTimeout(timer); resolve(); };
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            tag.async = true;
            tag.onerror = () => { clearTimeout(timer); ytApiReadyPromise = null; reject(new Error("Failed to load YouTube API.")); };
            document.head.appendChild(tag);
        });
        return ytApiReadyPromise;
    }

    function showPlayerMessage(msg) {
        const el = document.getElementById('yt-status');
        el.innerHTML = msg;
        el.classList.add('show');
    }
    function hidePlayerMessage() {
        document.getElementById('yt-status').classList.remove('show');
    }

    function extractVideoId(url) {
        try {
            const u = new URL(url);
            if (u.hostname === 'youtu.be') return (u.pathname.split('/')[1]) || null;
            if (u.hostname === 'www.youtube-nocookie.com') {
                const v = u.searchParams.get('v');
                if (v) return v;
            }
            if (u.hostname === 'www.youtube.com' || u.hostname === 'youtube.com' || u.hostname === 'music.youtube.com' || u.hostname === 'm.youtube.com') {
                const v = u.searchParams.get('v');
                if (v) return v;
                const m = u.pathname.match(/\/(?:embed|shorts|live|v)\/([\w-]{11})/);
                if (m) return m[1];
            }
        } catch(e) {}
        const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/|\/v\/)([\w-]{11})/);
        return m ? m[1] : null;
    }

    function createPlayer(vidId) {
        if(player) { try { player.destroy(); } catch(e) {} player = null; }
        hidePlayerMessage();
        const origin = (window.location.protocol === 'http:' || window.location.protocol === 'https:') ? window.location.origin : undefined;
        try {
            player = new YT.Player('yt-player', {
                height: '100%', width: '100%', videoId: vidId,
                playerVars: { 'playsinline': 1, 'controls': 1, 'rel': 0, ...(origin ? { origin } : {}) },
                events: {
                    'onStateChange': (e) => document.getElementById('play-btn').textContent = (e.data === 1) ? "II" : "▶",
                    'onReady': (e) => {
                        if(e.target.getVideoData) {
                            const t = e.target.getVideoData().title;
                            if(t) {
                                state.videoTitle = cleanTitle(t);
                                document.getElementById('song-title-disp').innerText = state.videoTitle;
                            }
                        }
                        speedIdx = 2; updateSpeedBtn();
                    },
                    'onError': (e) => {
                        const codes = {
                            2: "Invalid video ID.",
                            5: "The requested content cannot be played in an HTML5 player.",
                            100: "Video not found or has been removed.",
                            101: "Embedding has been disabled for this video.",
                            150: "Embedding has been disabled for this video.",
                            153: "Playback is restricted on this page. Open the file over http:// (local server), not file://"
                        };
                        showPlayerMessage("⚠️ " + (codes[e.data] || ("YouTube error " + e.data)));
                    }
                }
            });
        } catch(err) {
            showPlayerMessage("⚠️ " + err.message);
        }
        startLoop();
    }

    function loadVideo() {
        const url = document.getElementById('yt-url').value.trim();
        if(!url) return alert("Please paste a YouTube link");
        if (window.location.protocol === 'file:') {
            showPlayerMessage("YouTube blocks embeds on file:// pages. Run a local server from this folder (e.g. <code>python -m http.server 8000</code>) and open via <code>http://localhost:8000/Test/index.html</code>.");
        }
        const vidId = extractVideoId(url);
        if(!vidId) return alert("Could not find a video ID in that link");
        ensureYTApi()
            .then(() => createPlayer(vidId))
            .catch(err => showPlayerMessage("⚠️ " + err.message));
    }
    
    function cleanTitle(t) { return t.replace(/[\(\[\{].*?[\)\]\}]/g, '').replace(/official\s+video/gi, '').replace(/lyrics/gi, '').trim(); }

    async function fetchLyrics() {
        if(!state.videoTitle || state.videoTitle === "Song Lyrics") return alert("Load YouTube video first!");
        
        const btn = document.getElementById('btn-fetch');
        const txtArea = document.getElementById('raw-input');
        const originalText = btn.innerText;
        
        btn.innerText = "⏳..."; btn.style.opacity = "0.7"; btn.disabled = true;

        try {
            const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(state.videoTitle)}`);
            const data = await response.json();

            if (Array.isArray(data) && data.length > 0) {
                const song = data[0];
                const lyrics = song.syncedLyrics || song.plainLyrics;
                if (!lyrics) throw new Error("No content");
                
                txtArea.value = lyrics;
                parseAndDisplayLyrics();
                btn.innerText = "✔ Loaded!";
            } else {
                throw new Error("No results");
            }
        } catch (e) {
            console.log("Auto-fetch failed:", e);
            window.open(`https://www.google.com/search?q=${encodeURIComponent(state.videoTitle + " lyrics")}`, '_blank');
            btn.innerText = "❌ Google";
        } finally {
            setTimeout(() => { btn.innerText = originalText; btn.style.opacity = "1"; btn.disabled = false; }, 1500);
        }
    }

    function startLoop() {
        if(timer) cancelAnimationFrame(timer);
        const loop = () => {
            if(player && player.getCurrentTime) {
                const t = player.getCurrentTime();
                document.getElementById('curr-t').innerText = fmtTime(t);
                document.getElementById('time-display').innerText = fmtTime(t, true);
                const d = player.getDuration();
                if(d) {
                    document.getElementById('dur-t').innerText = fmtTime(d);
                    const s = document.getElementById('seek');
                    if(document.activeElement !== s) { s.max = d; s.value = t; }
                }
                const am = document.getElementById('lyrics-container');
                if (am && state.lyrics.length) am.currentTime = Math.round(t * 1000);
            }
            timer = requestAnimationFrame(loop);
        };
        loop();
    }

    function togglePlay() { if(!player) return; player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); }
    function seek(n) { if(player) player.seekTo(player.getCurrentTime() + n, true); }
    function userSeek() { if(player) player.seekTo(document.getElementById('seek').value, true); }
    function cycleSpeed() { speedIdx = (speedIdx + 1) % speeds.length; player.setPlaybackRate(speeds[speedIdx]); updateSpeedBtn(); }
    function updateSpeedBtn() { document.getElementById('btn-speed').innerText = speeds[speedIdx] + "x"; }

    function parseAndDisplayLyrics() {
        const raw = document.getElementById('raw-input').value.trim();
        if(!raw) return alert("Please paste LRC or ELRC lyrics first!");

        // AUTO DETECT MODE: Check if raw lyrics contain word-by-word timestamp tags like <00:12.34>
        const isELRC = /\<\d{2}:\d{2}/.test(raw);
        state.mode = isELRC ? 'word' : 'line';

        const ind = document.getElementById('detected-ind');
        const txt = document.getElementById('detected-text');
        const badge = document.getElementById('mode-badge');

        if(isELRC) {
            ind.style.background = "#3b82f6";
            ind.style.boxShadow = "0 0 10px #3b82f6";
            txt.innerText = "Detected ELRC (Word-by-Word)";
            badge.innerText = "Word ELRC";
        } else {
            ind.style.background = "#10b981";
            ind.style.boxShadow = "0 0 10px #10b981";
            txt.innerText = "Detected Standard LRC (Line-Synced)";
            badge.innerText = "Line LRC";
        }

        let lastType = 'v1';
        state.lyrics = raw.split('\n').filter(x => x.trim()).map(lineStr => {
            let txt = lineStr.trim();
            let type = lastType;
            let lineTime = null;

            // Extract line start timestamp [mm:ss.xx]
            const lineTimeMatch = txt.match(/^\[(\d{2}):(\d{2})(?:\.(\d+))?\]/);
            if(lineTimeMatch) {
                const min = parseInt(lineTimeMatch[1]);
                const sec = parseInt(lineTimeMatch[2]);
                const msStr = lineTimeMatch[3] || "0";
                const ms = parseFloat("0." + msStr);
                lineTime = min * 60 + sec + ms;
                txt = txt.replace(/^\[.*?\]/, '').trim();
            }

            // Extract vocal tags [v1], [v2], [bg], v1:, v2:, [bg:
            if(txt.toLowerCase().includes('[bg]')) { type = 'bg'; txt = txt.replace(/\[bg\]/gi, '').trim(); }
            else if(txt.toLowerCase().includes('[v2]')) { type = 'v2'; txt = txt.replace(/\[v2\]/gi, '').trim(); }
            else if(txt.toLowerCase().includes('[v1]')) { type = 'v1'; txt = txt.replace(/\[v1\]/gi, '').trim(); }
            else if(txt.toLowerCase().startsWith('v2:')) { type = 'v2'; txt = txt.substring(3).trim(); }
            else if(txt.toLowerCase().startsWith('v1:')) { type = 'v1'; txt = txt.substring(3).trim(); }
            else if(txt.toLowerCase().startsWith('[bg:')) { type = 'bg'; txt = txt.replace(/^\[bg:/i, '').replace(/\]$/, '').trim(); }

            lastType = type;

            let words = [];
            if(isELRC) {
                // Parse ELRC word tokens: <mm:ss.xx>WordText
                const tokenRegex = /\<(\d{2}):(\d{2})(?:\.(\d+))?\>([^\<]*)/g;
                let match;
                let tokens = [];
                while((match = tokenRegex.exec(txt)) !== null) {
                    const min = parseInt(match[1]);
                    const sec = parseInt(match[2]);
                    const msStr = match[3] || "0";
                    const ms = parseFloat("0." + msStr);
                    const startTime = min * 60 + sec + ms;
                    const wordText = match[4];
                    tokens.push({ s: startTime, t: wordText });
                }

                if(tokens.length > 0) {
                    // Set end times for each word token
                    for(let k = 0; k < tokens.length; k++) {
                        let wEnd = (k < tokens.length - 1) ? tokens[k+1].s : tokens[k].s + 0.6;
                        words.push({ t: tokens[k].t, s: tokens[k].s, e: wEnd });
                    }
                } else {
                    // Fallback to plain split
                    const parts = txt.split(/\s+/).filter(Boolean);
                    words = parts.map((w, wi) => ({ t: wi === parts.length - 1 ? w : w + " ", s: lineTime, e: null }));
                }
            } else {
                words = txt.split(/\s+/).map(w => ({ t: w, s: lineTime, e: null }));
            }

            return {
                text: txt.replace(/\<.*?\>/g, '').trim(),
                type: type,
                time: lineTime,
                words: words,
                lineSynced: !isELRC,
                isWordSynced: isELRC
            };
        });

        state.idx = 0;
        renderLyricsDisplay();
        toggleSidebar(false);
    }

    /* --- am-lyrics v1.5.4 integration (real <am-lyrics> component) --- */
    function buildAmLyrics() {
        const out = [];
        state.lyrics.forEach((l, i) => {
            const isBg = l.type === 'bg';
            const startMs = l.time != null ? Math.round(l.time * 1000) : 0;
            const nextTime = (() => {
                for (let k = i + 1; k < state.lyrics.length; k++) {
                    if (state.lyrics[k].type !== 'bg' && state.lyrics[k].time != null) return state.lyrics[k].time * 1000;
                }
                return null;
            })();
            let endMs;
            if (l.isWordSynced) {
                const last = l.words[l.words.length - 1];
                endMs = last && last.e != null ? Math.round((last.e + 1.2) * 1000)
                    : last ? Math.round((last.s + 3.5) * 1000)
                    : startMs + 3500;
            } else {
                endMs = nextTime != null ? nextTime : startMs + 3500;
            }

            if (isBg) {
                const words = l.words.map((w, wi) => {
                    const ws = w.s != null ? w.s : (l.time != null ? l.time : 0);
                    const isLast = wi === l.words.length - 1;
                    return {
                        text: isLast ? w.t.trimEnd() : w.t,
                        part: true,
                        timestamp: Math.round(ws * 1000),
                        endtime: Math.round((w.e != null ? w.e : ws + 0.6) * 1000),
                        isBackground: true,
                        lineSynced: false
                    };
                });
                const target = out[out.length - 1];
                if (target) {
                    target.backgroundText = (target.backgroundText || []).concat(words);
                    const bgEnd = words[words.length - 1].endtime;
                    if (target.endtime < bgEnd) target.endtime = bgEnd;
                    return;
                }
                out.push({
                    text: [{ text: "", part: false, timestamp: startMs, endtime: endMs, lineSynced: true }],
                    backgroundText: words,
                    background: true,
                    timestamp: startMs,
                    endtime: endMs,
                    isWordSynced: true,
                    alignment: 'start'
                });
                return;
            }

            const line = {
                background: false,
                timestamp: startMs,
                endtime: endMs,
                isWordSynced: !!l.isWordSynced,
                alignment: l.type === 'v2' ? 'end' : 'start'
            };
            if (l.isWordSynced) {
                // Apple-style ELRC: each word carries its trailing space so the
                // component's group splitter keeps every word as its own group
                // (per-word grow/char-rise gates).
                line.text = l.words.map((w, wi) => {
                    const ws = w.s != null ? w.s : (l.time != null ? l.time : 0);
                    const isLast = wi === l.words.length - 1;
                    return {
                        text: isLast ? w.t.trimEnd() : w.t,
                        part: true,
                        timestamp: Math.round(ws * 1000),
                        endtime: Math.round((w.e != null ? w.e : ws + 0.6) * 1000),
                        isBackground: false,
                        lineSynced: false
                    };
                });
            } else {
                line.text = [{ text: l.text, part: false, timestamp: startMs, endtime: endMs, lineSynced: true }];
            }
            out.push(line);
        });
        return out;
    }

    function injectShadowCleanup(am) {
        if (!am || am.__amStyleInjected || !am.shadowRoot) return;
        am.__amStyleInjected = true;
        const style = document.createElement('style');
        style.textContent =
            '.lyrics-header{display:none !important;}' +
            '.lyrics-footer{display:none !important;}' +
            '.lyrics-container{padding-bottom:280px !important;}';
        am.shadowRoot.appendChild(style);
    }

    function renderLyricsDisplay() {
        const am = document.getElementById('lyrics-container');
        if (!am) return;
        const built = buildAmLyrics();
        // The component's own fetchLyrics() (triggered on connect) clears
        // `lyrics` in a microtask; set ours in a macrotask so it always wins.
        setTimeout(async () => {
            am.lyrics = [];
            am.lyricsSource = "Pasted";
            am.fontFamily = "Outfit, 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
            await am.updateComplete;
            // Production render order: the line DOM is built from
            // cachedLineData, which only fills in `updated()` after the first
            // render — flipping isLoading forces the final render with groups.
            am.isLoading = true;
            am.lyrics = built;
            am.currentTime = 0;
            await am.updateComplete;
            am.isLoading = false;
            await am.updateComplete;
            injectShadowCleanup(am);
            am.style.opacity = 1;
        }, 0);
    }



    function fmtTime(s, ms=false) { 
        if(!s) return ms?"00:00.000":"0:00"; 
        const m = Math.floor(s/60); 
        const sc = Math.floor(s%60); 
        const msc = Math.floor((s % 1) * 1000); 
        return `${m.toString().padStart(2,'0')}:${sc.toString().padStart(2,'0')}${ms?'.'+msc.toString().padStart(3,'0'):''}`; 
    }
    
    function toggleSidebar(o) { 
        const s = document.getElementById('sidebar'); 
        s.classList.toggle('open', o); 
        if(window.innerWidth >= 900) document.getElementById('sidebar').classList.toggle('closed', !o); 
    }
    
    document.addEventListener('keydown', e => {
        if(e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
        if(e.code === 'Space') { e.preventDefault(); togglePlay(); }
        if(e.code === 'ArrowRight') seek(5);
        if(e.code === 'ArrowLeft') seek(-5);
    });

</script>
